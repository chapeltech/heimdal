---
name: Build Asgard Heimdal packages

on:
  push:
    branches:
      - asgard-package
    paths:
      - .github/workflows/asgard-packages.yml
      - debian/**
      - packaging/**

permissions:
  contents: read

concurrency:
  group: asgard-heimdal-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check selected release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
          snapshot=${version#*+}
          test -n "$snapshot"
          test "$snapshot" != "$version"
          release_tag=asgard-$snapshot
          gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          printf 'release_tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"

  debian:
    name: Debian 13 (${{ matrix.architecture }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      PACKAGING_DIR: ${{ github.workspace }}/packaging
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      SOURCE_DIR: ${{ github.workspace }}/source
      TARGET_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: packaging
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 0
          path: source
      - name: Build and validate Debian packages
        run: |
          "$PACKAGING_DIR/packaging/ci/build-debian"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.architecture }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 1

  rpm:
    name: EL9.6 (x86_64)
    needs: release
    runs-on: ubuntu-24.04
    container: quay.io/rockylinux/rockylinux:9.6@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      PACKAGING_DIR: ${{ github.workspace }}/packaging
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      SOURCE_DIR: ${{ github.workspace }}/source
      TARGET_ARCHITECTURE: x86_64
      GNUPGHOME: /tmp/archive-signing
    steps:
      - name: Lock package repositories to Rocky 9.6
        run: |
          grep -q '^Rocky Linux release 9\.6 ' /etc/rocky-release
          rm -f /etc/yum.repos.d/*.repo
          cat >/etc/yum.repos.d/rocky-vault.repo <<'EOF'
          [baseos]
          name=Rocky Linux 9.6 - BaseOS
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/BaseOS/$basearch/os/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9

          [appstream]
          name=Rocky Linux 9.6 - AppStream
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/AppStream/$basearch/os/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9

          [crb]
          name=Rocky Linux 9.6 - CRB
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/CRB/$basearch/os/
          enabled=0
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9

          [extras]
          name=Rocky Linux 9.6 - Extras
          baseurl=https://dl.rockylinux.org/vault/rocky/9.6/extras/$basearch/os/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9
          EOF
      - name: Install checkout and signing dependencies
        run: dnf install -y ca-certificates git gnupg2 rpm-sign
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: packaging
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 0
          path: source
      - name: Build and validate RPM packages
        run: |
          "$PACKAGING_DIR/packaging/ci/build-rpm"
      - name: Sign and verify RPM packages
        env:
          ARCHIVE_SIGNING_FINGERPRINT: ${{ vars.ARCHIVE_SIGNING_FINGERPRINT }}
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
          ARCHIVE_SIGNING_PASSPHRASE: ${{ secrets.ARCHIVE_SIGNING_PASSPHRASE }}
        run: |
          test -n "$ARCHIVE_SIGNING_KEY"
          test -n "$ARCHIVE_SIGNING_PASSPHRASE"
          fingerprint=$(printf '%s' "$ARCHIVE_SIGNING_FINGERPRINT" |
            tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          case "$fingerprint" in
            ????????????????????????????????????????) ;;
            *) exit 1 ;;
          esac
          case "$fingerprint" in
            *[!0-9A-F]*) exit 1 ;;
          esac

          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$ARCHIVE_SIGNING_KEY" | gpg2 --batch --import
          passphrase_file=$GNUPGHOME/passphrase
          public_key=$GNUPGHOME/public.asc
          install -m 600 /dev/null "$passphrase_file"
          printf '%s' "$ARCHIVE_SIGNING_PASSPHRASE" >"$passphrase_file"
          gpg2 --batch --armor --export "$fingerprint" >"$public_key"
          rpmkeys --import "$public_key"

          find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.rpm' \
            -print0 | while IFS= read -r -d '' package; do
              rpmsign --addsign \
                --define "_gpg_name $fingerprint" \
                --define "_gpg_path $GNUPGHOME" \
                --define "_gpg_digest_algo sha256" \
                --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $passphrase_file" \
                "$package"
              rpmkeys --checksig --verbose "$package" | \
                grep -Eq 'Signature.*, key ID [[:xdigit:]]+: OK'
            done
      - name: Remove signing key material
        if: ${{ always() }}
        run: rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-el9-x86_64
          path: artifacts/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release assets
    needs: [release, debian, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- * >SHA256SUMS
      - name: Upload packages
        run: >-
          gh release upload "$RELEASE_TAG" artifacts/*
          --repo "$GITHUB_REPOSITORY" --clobber
